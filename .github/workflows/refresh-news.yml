name: Atualizar notícias e publicar Explore

on:
  # O catálogo é reconstruído sem depender de novos commits no código.
  # Horários deslocados reduzem atrasos do GitHub Actions no início da hora.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-news-refresh'
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Python
        run: pip install -r requirements.txt

      - name: Sincronizar fontes e gerar catálogo atualizado
        run: python3 scripts/export_gh_pages.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato atualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Publicar catálogo atualizado
        id: deployment
        uses: actions/deploy-pages@v4
