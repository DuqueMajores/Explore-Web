name: Deploy Explore to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Python
        run: |
          pip install flask flask_sqlalchemy requests

      - name: Exportar Site Estático (docs/)
        run: |
          python3 scripts/export_gh_pages.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato do Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
